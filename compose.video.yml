services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: video_harness
      POSTGRES_USER: video_harness
      POSTGRES_PASSWORD: video_harness_local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U video_harness -d video_harness"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - video-harness-postgres:/var/lib/postgresql/data

  video-db-migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: video_harness_local
    volumes:
      - ./services/video-runtime/migrations/video_runtime:/migrations:ro
    command:
      - sh
      - -c
      - for migration in /migrations/*.sql; do psql -v ON_ERROR_STOP=1 -h postgres -U video_harness -d video_harness -f "$$migration"; done

  video-runtime:
    build:
      context: .
      dockerfile: services/video-runtime/Dockerfile.runtime
    depends_on:
      video-db-migrate:
        condition: service_completed_successfully
      sandbox-worker:
        condition: service_healthy
      media-service:
        condition: service_healthy
    environment:
      VIDEO_RUNTIME_DATABASE_URL: postgresql://video_harness:video_harness_local@postgres:5432/video_harness
      VIDEO_RUNTIME_ENVIRONMENT: development
      VIDEO_RUNTIME_SERVICE_TOKEN: video-harness-runtime-local
      VIDEO_RUNTIME_LOCAL_USER_ID: local-user
      VIDEO_AGENT_BACKEND: deepseek
      VIDEO_INCREMENTAL_ENGINE_ENABLED: "true"
      VIDEO_STAGED_PLANNING_ENABLED: "true"
      VIDEO_CONTINUOUS_PLAN_PATCH_ENABLED: "true"
      VIDEO_PLUGIN_PATHS: /srv/video-runtime/plugins
      VIDEO_CAPABILITY_GRANT_SECRET: ${VIDEO_CAPABILITY_GRANT_SECRET:-video-harness-local-development-grant-secret}
      ACCOUNT_BACKEND: ${ACCOUNT_BACKEND:-env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      WAVESPEED_API_KEY: ${WAVESPEED_API_KEY:-}
      SUNO_API_KEY: ${SUNO_API_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      POLLO_API_KEY: ${POLLO_API_KEY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,postgres,video-runtime,media-service,sandbox-worker,deepseek-harness}
      DEEPSEEK_HARNESS_URL: http://host.docker.internal:3080
      DEEP_AGENT_V2_SANDBOX_ENABLED: "true"
      DEEP_AGENT_V2_SANDBOX_WORKER_URL: http://sandbox-worker:8080
      DEEP_AGENT_V2_SANDBOX_TOKEN: video-harness-sandbox-local
      VIDEO_SANDBOX_WORKER_URL: http://sandbox-worker:8080
      VIDEO_SANDBOX_WORKER_TOKEN: video-harness-sandbox-local
      MEDIA_SERVICE_URL: http://media-service:8080
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /var/lib/video-harness-media
      PUBLIC_BASE_URL: http://localhost:8001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - video-harness-media:/var/lib/video-harness-media

  media-service:
    build:
      context: ./services/media-service
    shm_size: "2gb"
    environment:
      ENVIRONMENT: development
      STORAGE_BACKEND: local
      LOCAL_STORAGE_DIR: /var/lib/video-harness-media
      PUBLIC_BASE_URL: http://localhost:8001
      FFMPEG_THREADS: "2"
      MAX_CONCURRENT_JOBS: "3"
      WATERMARK_IMAGE_PATH: assets/watermark.png
      HYPERFRAMES_CLI: /opt/hyperframes/node_modules/.bin/hyperframes
      HYPERFRAMES_NODE_BIN: /usr/local/bin
      HYPERFRAMES_CJK_FONT: /usr/share/fonts/truetype/cuti/NotoSansSC-VF.ttf
      HYPERFRAMES_DOCKER: "false"
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-127.0.0.1,localhost,video-runtime,media-service}
    volumes:
      - video-harness-media:/var/lib/video-harness-media
    ports:
      - "18080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  sandbox-worker:
    build:
      context: ./services/sandbox-worker
    environment:
      SANDBOX_ENVIRONMENT: development
      SANDBOX_INTERNAL_TOKEN: video-harness-sandbox-local
      SANDBOX_STAGING_ROOT: /var/lib/cuti-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - video-harness-sandbox:/var/lib/cuti-sandbox
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5

  video-studio:
    build:
      context: .
      dockerfile: apps/video-studio/Dockerfile
      args:
        VITE_LOCAL_SINGLE_USER_MODE: "true"
        VITE_API_BASE_URL: /api/v1
    depends_on:
      video-runtime:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  video-harness-postgres:
  video-harness-sandbox:
  video-harness-media:
