name: Build images

# Docker → ECR. Does not helm. DeepSeek ci.yml / e2e.yml stay.
# Tags: push/build on main → `main` (production). Git branch `dev` (and other listed non-main branches) → image tag `dev`.
on:
  push:
    branches: [main, master, dev, deepseek-harness]
    paths:
      - apps/video-studio/**
      - apps/dsh/**
      - apps/video-studio/Dockerfile
      - apps/dsh/Dockerfile
      - services/video-runtime/**
      - services/media-service/**
      - .github/workflows/vda-images.yml
  workflow_dispatch:
    inputs:
      only:
        description: Build one image or all
        type: choice
        default: all
        options: [all, runtime, media, studio, dsh]

permissions:
  contents: read
  id-token: write

concurrency:
  group: vda-images-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            image: cuti-videoagent
            context: .
            dockerfile: services/video-runtime/Dockerfile.runtime
          - name: media
            image: cuti-media-service
            context: services/media-service
            dockerfile: services/media-service/Dockerfile
          - name: studio
            image: cuti-video-studio
            context: .
            dockerfile: apps/video-studio/Dockerfile
          - name: dsh
            image: cuti-deepseek-harness
            context: .
            dockerfile: apps/dsh/Dockerfile
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all' || inputs.only == matrix.name
    steps:
      - uses: actions/checkout@v4

      - id: tag
        name: Image tag is main or dev
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ] || [ "$GITHUB_REF_NAME" = "master" ]; then
            tag=main
          else
            tag=dev
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "will push ${ECR_REGISTRY}/${{ matrix.image }}:$tag"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ env.SHORT_SHA }}
            VITE_LOCAL_SINGLE_USER_MODE=false
            VITE_API_BASE_URL=/api/v1
