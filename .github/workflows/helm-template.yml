name: Helm template

on:
  pull_request:
    paths:
      - deploy/**
      - services/video-runtime/helm/**
      - services/media-service/helm/**
  push:
    branches: [main, master, dev, deepseek-harness]
    paths:
      - deploy/**
      - services/video-runtime/helm/**
      - services/media-service/helm/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: helm template charts
        run: |
          set -euo pipefail
          for env in dev prod; do
            helm template cuti-studio deploy/charts/video-studio -f deploy/overlays/$env/studio.yaml >/dev/null
            helm template cuti-dsh deploy/charts/deepseek-harness -f deploy/overlays/$env/dsh.yaml >/dev/null
            helm template cuti-postgres deploy/charts/postgres -f deploy/overlays/$env/postgres.yaml >/dev/null
            helm template cuti-redis deploy/charts/redis -f deploy/overlays/$env/redis.yaml >/dev/null
            helm template cuti-migrate deploy/charts/runtime-migrate -f deploy/overlays/$env/runtime-migrate.yaml >/dev/null
            helm template cuti-runtime services/video-runtime/helm/cuti-videoagent \
              -f deploy/overlays/$env/runtime.yaml >/dev/null
            helm template cuti-media services/media-service/helm/cuti-media-service \
              -f deploy/overlays/$env/media.yaml >/dev/null
          done
