name: VDA

# One run: check Helm, build images to ECR, then helm upgrade.
# Git dev → image tag dev → namespace vda-dev.
# Git main → image tag main → namespace vda-prod.
# Does not touch live namespaces dev/prod. Does not touch Postgres/Redis.
# Manual Run: pick dev or prod, tick services (default all).

on:
  pull_request:
    paths:
      - deploy/**
      - services/video-runtime/helm/**
      - services/media-service/helm/**
      - .github/workflows/vda.yml
  push:
    branches: [main, dev]
    paths:
      - apps/video-studio/**
      - apps/dsh/**
      - services/video-runtime/**
      - services/media-service/**
      - deploy/**
      - .github/workflows/vda.yml
  workflow_dispatch:
    inputs:
      environment:
        description: 部署到哪（dev 用镜像 tag dev，prod 用镜像 tag main）
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      studio:
        description: 前端 Video Studio
        type: boolean
        default: true
      runtime:
        description: Video Runtime（生成视频的后端）
        type: boolean
        default: true
      media:
        description: Media Service（媒体存储/转码）
        type: boolean
        default: true
      dsh:
        description: DeepSeek Harness（对话 agent）
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: vda-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && inputs.environment) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com
  EKS_CLUSTER: cuti-cluster

jobs:
  helm:
    name: Helm template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: helm template charts
        run: |
          set -euo pipefail
          for env in dev prod; do
            helm template cuti-studio deploy/charts/video-studio -f deploy/overlays/$env/studio.yaml >/dev/null
            helm template cuti-dsh deploy/charts/deepseek-harness -f deploy/overlays/$env/dsh.yaml >/dev/null
            helm template cuti-postgres deploy/charts/postgres -f deploy/overlays/$env/postgres.yaml >/dev/null
            helm template cuti-redis deploy/charts/redis -f deploy/overlays/$env/redis.yaml >/dev/null
            helm template cuti-migrate deploy/charts/runtime-migrate -f deploy/overlays/$env/runtime-migrate.yaml >/dev/null
            helm template cuti-runtime services/video-runtime/helm/cuti-videoagent \
              -f deploy/overlays/$env/runtime.yaml >/dev/null
            helm template cuti-media services/media-service/helm/cuti-media-service \
              -f deploy/overlays/$env/media.yaml >/dev/null
          done

  setup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.s.outputs.env }}
      tag: ${{ steps.s.outputs.tag }}
    steps:
      - id: s
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            env="${{ inputs.environment }}"
          elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            env=prod
          else
            env=dev
          fi
          if [ "$env" = "prod" ]; then tag=main; else tag=dev; fi
          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "SHORT_SHA=${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
          echo "will build and deploy tag $tag to vda-$env"

  images:
    name: Build ${{ matrix.name }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: runtime
            image: cuti-videoagent
            context: .
            dockerfile: services/video-runtime/Dockerfile.runtime
          - name: media
            image: cuti-media-service
            context: services/media-service
            dockerfile: services/media-service/Dockerfile
          - name: studio
            image: cuti-video-studio
            context: .
            dockerfile: apps/video-studio/Dockerfile
          - name: dsh
            image: cuti-deepseek-harness
            context: .
            dockerfile: apps/dsh/Dockerfile
    if: |
      github.event_name != 'pull_request' && (
        github.event_name != 'workflow_dispatch' ||
        (matrix.name == 'studio' && inputs.studio) ||
        (matrix.name == 'runtime' && inputs.runtime) ||
        (matrix.name == 'media' && inputs.media) ||
        (matrix.name == 'dsh' && inputs.dsh)
      )
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ needs.setup.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
            VITE_LOCAL_SINGLE_USER_MODE=false
            VITE_API_BASE_URL=/api/v1

  deploy:
    name: Deploy
    needs: [setup, helm, images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vda-${{ needs.setup.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: helm upgrade selected services
        run: |
          set -euo pipefail
          env="${{ needs.setup.outputs.env }}"
          tag="${{ needs.setup.outputs.tag }}"
          echo "deploying tag $tag to vda-$env"
          chmod +x deploy/vda-upgrade.sh
          args=( "$env" --tag "$tag" )
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.studio }}" = "true" ]; then args+=(--studio); fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.runtime }}" = "true" ]; then args+=(--runtime); fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.media }}" = "true" ]; then args+=(--media); fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.dsh }}" = "true" ]; then args+=(--dsh); fi
          ./deploy/vda-upgrade.sh "${args[@]}"
