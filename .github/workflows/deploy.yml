name: Build and deploy

# One run: check Helm, build images to ECR, then helm upgrade.
# Git dev → namespace vda-dev. Git main → namespace vda-prod.
# Images are tagged with the git SHA (what Helm deploys) and also the floating
# alias `dev` or `main` (human lookup only). Do not helm-upgrade from the alias.
# Does not touch live namespaces dev/prod. Does not touch Postgres/Redis.
# Manual Run: pick dev or prod, tick services (default all).

on:
  pull_request:
    paths:
      - deploy/**
      - services/video-runtime/helm/**
      - services/media-service/helm/**
      - .github/workflows/deploy.yml
  push:
    branches: [main, dev]
    paths:
      - apps/video-studio/**
      - apps/dsh/**
      - services/video-runtime/**
      - services/media-service/**
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:
    inputs:
      environment:
        description: 部署到哪（镜像按本次 git SHA 部署；并额外打上浮动 tag dev 或 main）
        type: choice
        required: true
        default: dev
        options: [dev, prod]
      studio:
        description: 前端 Video Studio
        type: boolean
        default: true
      runtime:
        description: Video Runtime（生成视频的后端）
        type: boolean
        default: true
      media:
        description: Media Service（媒体存储/转码）
        type: boolean
        default: true
      dsh:
        description: DeepSeek Harness（对话 agent）
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && inputs.environment) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ap-southeast-2
  ECR_REGISTRY: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com
  EKS_CLUSTER: cuti-cluster

jobs:
  helm:
    name: Helm template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - name: helm template charts
        run: |
          set -euo pipefail
          for env in dev prod; do
            helm template cuti-studio deploy/charts/video-studio -f deploy/overlays/$env/studio.yaml >/dev/null
            helm template cuti-dsh deploy/charts/deepseek-harness -f deploy/overlays/$env/dsh.yaml >/dev/null
            helm template cuti-postgres deploy/charts/postgres -f deploy/overlays/$env/postgres.yaml >/dev/null
            helm template cuti-redis deploy/charts/redis -f deploy/overlays/$env/redis.yaml >/dev/null
            helm template cuti-migrate deploy/charts/runtime-migrate -f deploy/overlays/$env/runtime-migrate.yaml >/dev/null
            helm template cuti-runtime services/video-runtime/helm/cuti-videoagent \
              -f deploy/overlays/$env/runtime.yaml >/dev/null
            helm template cuti-media services/media-service/helm/cuti-media-service \
              -f deploy/overlays/$env/media.yaml >/dev/null
          done

  setup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.s.outputs.env }}
      tag: ${{ steps.s.outputs.tag }}
      floating: ${{ steps.s.outputs.floating }}
      images: ${{ steps.s.outputs.images }}
    steps:
      - id: s
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_STUDIO: ${{ inputs.studio }}
          INPUT_RUNTIME: ${{ inputs.runtime }}
          INPUT_MEDIA: ${{ inputs.media }}
          INPUT_DSH: ${{ inputs.dsh }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            env="$INPUT_ENV"
          elif [ "${GITHUB_REF_NAME}" = "main" ] || [ "${GITHUB_REF_NAME}" = "master" ]; then
            env=prod
          else
            env=dev
          fi
          if [ "$env" = "prod" ]; then floating=main; else floating=dev; fi
          tag="$GITHUB_SHA"

          want() {
            if [ "$EVENT_NAME" != "workflow_dispatch" ]; then return 0; fi
            [ "$1" = "true" ]
          }

          images='[]'
          add() {
            images=$(jq -c -n --argjson cur "$images" --arg n "$1" --arg i "$2" --arg c "$3" --arg d "$4" \
              '$cur + [{name:$n, image:$i, context:$c, dockerfile:$d}]')
          }
          if want "$INPUT_RUNTIME"; then add runtime cuti-videoagent . services/video-runtime/Dockerfile.runtime; fi
          if want "$INPUT_MEDIA"; then add media cuti-media-service services/media-service services/media-service/Dockerfile; fi
          if want "$INPUT_STUDIO"; then add studio cuti-video-studio . apps/video-studio/Dockerfile; fi
          if want "$INPUT_DSH"; then add dsh cuti-deepseek-harness . apps/dsh/Dockerfile; fi

          echo "env=$env" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "floating=$floating" >> "$GITHUB_OUTPUT"
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "will build SHA $tag and alias $floating, deploy to vda-$env images=$images"

  images:
    name: Build ${{ matrix.name }}
    needs: setup
    if: github.event_name != 'pull_request' && needs.setup.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ needs.setup.outputs.tag }}
            ${{ env.ECR_REGISTRY }}/${{ matrix.image }}:${{ needs.setup.outputs.floating }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ github.sha }}
            VITE_LOCAL_SINGLE_USER_MODE=false
            VITE_API_BASE_URL=/api/v1

  deploy:
    name: Deploy
    needs: [setup, helm, images]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: vda-${{ needs.setup.outputs.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3
      - uses: azure/setup-kubectl@v4
        with:
          version: v1.31.0
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
      - name: kubeconfig
        run: aws eks update-kubeconfig --name "$EKS_CLUSTER" --region "$AWS_REGION"
      - name: helm upgrade selected services
        run: |
          set -euo pipefail
          env="${{ needs.setup.outputs.env }}"
          tag="${{ needs.setup.outputs.tag }}"
          echo "deploying SHA $tag (alias ${{ needs.setup.outputs.floating }}) to vda-$env"
          chmod +x deploy/vda-upgrade.sh
          args=( "$env" --tag "$tag" )
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.studio }}" = "true" ]; then args+=(--studio); fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.runtime }}" = "true" ]; then args+=(--runtime); fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.media }}" = "true" ]; then args+=(--media); fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.dsh }}" = "true" ]; then args+=(--dsh); fi
          ./deploy/vda-upgrade.sh "${args[@]}"
