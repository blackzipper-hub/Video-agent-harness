server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker embedded DNS. Do not put cuti-api-go in a static proxy_pass:
  # colleague `compose.video.yml` has no Go, and nginx would fail to start.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/video/ {
    proxy_buffering off;
    proxy_pass http://video-runtime:8001;
  }

  location /chat-v1/ {
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_pass http://video-runtime:8001;
  }

  location /files/ {
    proxy_buffering off;
    proxy_pass http://video-runtime:8001;
  }

  location /api/v1/ {
    set $cuti_go cuti-api-go:8443;
    proxy_pass http://$cuti_go;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Studio production build default API_BASE_URL is /api + /users/...
  location /api/ {
    set $cuti_go cuti-api-go:8443;
    rewrite ^/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://$cuti_go;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
