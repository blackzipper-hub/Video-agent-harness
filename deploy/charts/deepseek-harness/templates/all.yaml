{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-home
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  storageClassName: {{ .Values.persistence.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.persistence.size | quote }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-proxy
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location / {
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:3080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:3080;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: deepseek-harness
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: deepseek-harness
  template:
    metadata:
      labels:
        app: deepseek-harness
    spec:
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: dsh
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["pnpm", "dsh", "--profile", "web", "--patch", "packages/bundle/video-agent/cordis.patch.yml", "--no-open"]
          envFrom:
            - secretRef:
                name: {{ .Values.secretEnvFrom }}
          env:
            - name: VIDEO_RUNTIME_URL
              value: {{ .Values.env.VIDEO_RUNTIME_URL | quote }}
            {{- if .Values.env.VIDEO_RUNTIME_SERVICE_TOKEN }}
            - name: VIDEO_RUNTIME_SERVICE_TOKEN
              value: {{ .Values.env.VIDEO_RUNTIME_SERVICE_TOKEN | quote }}
            {{- end }}
            - name: VIDEO_RUNTIME_USER_ID
              value: {{ .Values.env.VIDEO_RUNTIME_USER_ID | quote }}
            - name: VIDEO_AGENT_MODEL
              value: {{ .Values.env.VIDEO_AGENT_MODEL | quote }}
            - name: DSH_HOME
              value: /var/lib/dsh
            - name: HOME
              value: /var/lib/dsh-home
          resources:
            {{- toYaml .Values.resources.dsh | nindent 12 }}
          volumeMounts:
            - name: dsh-home
              mountPath: /var/lib/dsh
            - name: dsh-user-home
              mountPath: /var/lib/dsh-home
        - name: proxy
          image: {{ .Values.proxyImage | quote }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: proxy-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          resources:
            {{- toYaml .Values.resources.proxy | nindent 12 }}
      volumes:
        - name: dsh-home
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-home
          {{- else }}
          emptyDir:
            sizeLimit: 2Gi
          {{- end }}
        - name: dsh-user-home
          emptyDir:
            sizeLimit: 512Mi
        - name: proxy-config
          configMap:
            name: {{ .Release.Name }}-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: deepseek-harness
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3080
      targetPort: 8080
  selector:
    app: deepseek-harness
