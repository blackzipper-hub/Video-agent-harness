replicaCount: 1

image:
  repository: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com/cuti-video-studio
  tag: main
  pullPolicy: Always

service:
  type: ClusterIP
  port: 80

backends:
  videoRuntime: http://cuti-videoagent:8001
  cutiApiGo: http://cuti-api-go:8443

ingress:
  enabled: false
  className: alb
  scheme: internet-facing
  # Empty hosts → ALB DNS works before GoDaddy CNAME. Add host after DNS cutover.
  hosts: []
  certificateArn: ""
  sslRedirect: false
  annotations: {}


resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

nodeSelector: {}
