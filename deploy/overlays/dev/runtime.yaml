# Dev overlay for namespace cuti-dev. Do not helm upgrade the live `dev` release until cutover.
# Tokens and DSN stay in Secret cuti-videoagent-secrets.

image:
  repository: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com/cuti-videoagent
  tag: dev
  pullPolicy: Always

service:
  port: 8001

env:
  ENVIRONMENT: development
  LOG_LEVEL: info
  SERVER_PORT: "8001"
  AWS_REGION: ap-southeast-2
  VIDEO_RUNTIME_ENVIRONMENT: development
  VIDEO_RUNTIME_LOCAL_USER_ID: cuti-dev-user
  VIDEO_AGENT_BACKEND: deepseek
  VIDEO_INCREMENTAL_ENGINE_ENABLED: "true"
  VIDEO_PLUGIN_PATHS: /srv/video-runtime/plugins
  VIDEO_RUNTIME_DATABASE_SCHEMA: cuti_video_runtime
  ACCOUNT_BACKEND: env
  ENABLE_TASK_WORKER: "false"
  STORAGE_BACKEND: s3
  MEDIA_SERVICE_URL: http://cuti-media-service:8080
  DEEPSEEK_HARNESS_URL: http://deepseek-harness:3080

createSecret: false
secretEnvFrom: cuti-videoagent-secrets

persistence:
  enabled: false

ingress:
  enabled: false

autoscaling:
  enabled: false

replicaCount: 1

nodeSelector:
  workload-type: agent
