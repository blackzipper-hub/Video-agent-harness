image:
  repository: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com/cuti-media-service
  tag: dev
  pullPolicy: Always

env:
  ENVIRONMENT: development
  STORAGE_BACKEND: s3
  AWS_REGION: ap-southeast-2

createSecret: false
secretEnvFrom: cuti-media-service-secrets

ingress:
  enabled: false

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  scaleUp:
    stabilizationWindowSeconds: 30
    maxPods: 4
    periodSeconds: 60
  scaleDown:
    stabilizationWindowSeconds: 300
    maxPods: 1
    periodSeconds: 120

replicaCount: 1

# Two media-processing nodes are already full: live `dev`/`prod` Media (2 CPU)
# plus vda-dev/vda-prod (1 CPU). ASG cannot add a third instance (OutOfResource).
# Rolling with maxSurge: 1 therefore stays Pending and hits the progress deadline.
# Replace in place so GitHub dest deploys do not wait on a new node.
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

nodeSelector:
  workload: media-processing

serviceAccountName: default
