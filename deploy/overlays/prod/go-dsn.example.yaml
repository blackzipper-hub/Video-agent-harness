apiVersion: v1
kind: Secret
metadata:
  name: cuti-go-dsn
type: Opaque
stringData:
  # In-cluster Postgres only (vda-prod PVC). Do not use the EC2 host.
  # Separate from vda-dev (storybook_dev) and from the live EC2 storybook.
  dsn: postgres://cuti:replace-me@postgres:5432/storybook?sslmode=disable
