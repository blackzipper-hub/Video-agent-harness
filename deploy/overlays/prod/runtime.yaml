# Prod overlay for namespace cuti-prod. Ingress stays off until DNS cutover.
# Do not helm upgrade the live `prod` release with this until you intend to cut over.

image:
  repository: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com/cuti-videoagent
  tag: main
  pullPolicy: Always

service:
  port: 8001

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "3500m"
    memory: "12Gi"

env:
  ENVIRONMENT: production
  LOG_LEVEL: info
  SERVER_PORT: "8001"
  AWS_REGION: ap-southeast-2
  VIDEO_RUNTIME_ENVIRONMENT: production
  VIDEO_RUNTIME_LOCAL_USER_ID: cuti-prod-user
  VIDEO_AGENT_BACKEND: deepseek
  VIDEO_INCREMENTAL_ENGINE_ENABLED: "true"
  VIDEO_STAGED_PLANNING_ENABLED: "true"
  VIDEO_CONTINUOUS_PLAN_PATCH_ENABLED: "true"
  VIDEO_PLUGIN_PATHS: /srv/video-runtime/plugins
  VIDEO_RUNTIME_DATABASE_SCHEMA: cuti_video_runtime
  ACCOUNT_BACKEND: env
  STORAGE_BACKEND: s3
  MEDIA_SERVICE_URL: http://cuti-media-service:8080
  DEEPSEEK_HARNESS_URL: http://deepseek-harness:3080

createSecret: false
secretEnvFrom: cuti-videoagent-secrets

persistence:
  enabled: false

ingress:
  enabled: false

autoscaling:
  enabled: false

replicaCount: 1

nodeSelector:
  workload-type: agent
