image:
  tag: main

ingress:
  enabled: true
  scheme: internet-facing
  # ACM in ap-southeast-2 (ALB). Same names as the us-east-1 CloudFront cert,
  # so GoDaddy validation CNAMEs already exist. Do not use the us-east-1 ARN here.
  sslRedirect: false
  certificateArn: arn:aws:acm:ap-southeast-2:699475938168:certificate/35b92a6f-1b52-4cd9-9843-4246bb5d9b1b
  hosts: []
  annotations:
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1200

nodeSelector:
  workload-type: agent

backends:
  videoRuntime: http://cuti-videoagent:8001
  cutiApiGo: http://cuti-api-go:8443
