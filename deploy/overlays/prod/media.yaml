image:
  repository: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com/cuti-media-service
  tag: main
  pullPolicy: Always

env:
  ENVIRONMENT: production
  STORAGE_BACKEND: s3
  AWS_REGION: ap-southeast-2
  HYPERFRAMES_CLI: /opt/hyperframes/node_modules/.bin/hyperframes
  HYPERFRAMES_NODE_BIN: /usr/local/bin
  HYPERFRAMES_CJK_FONT: /usr/share/fonts/truetype/cuti/NotoSansSC-VF.ttf
  HYPERFRAMES_DOCKER: "false"

createSecret: false
secretEnvFrom: cuti-media-service-secrets

ingress:
  enabled: false

# Same HPA as live namespace `prod`: idle 1, busy up to 12, CPU 70%.
# Deployment replicas are owned by HPA when this is on.
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  scaleUp:
    stabilizationWindowSeconds: 30
    maxPods: 4
    periodSeconds: 60
  scaleDown:
    stabilizationWindowSeconds: 300
    maxPods: 1
    periodSeconds: 120

replicaCount: 1

# Same packing as dest: live prod Media + vda-prod already fill both media nodes.
# In-place replace until the media ASG can actually scale (currently OutOfResource).
strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

nodeSelector:
  workload: media-processing

serviceAccountName: default
