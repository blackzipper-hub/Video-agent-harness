server {
  listen 8080;
  server_name _;
  location / {
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:3080;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_buffering off;
    proxy_pass http://127.0.0.1:3080;
  }
}
