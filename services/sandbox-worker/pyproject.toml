[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuti-sandbox-worker"
version = "0.1.0"
description = "Isolated Docker sandbox execution service"
requires-python = ">=3.11"
dependencies = [
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

