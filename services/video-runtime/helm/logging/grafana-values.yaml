# Grafana：admin 账号密码来自集群 Secret `grafana-admin-credentials`（由 workflow 首次创建，不经 GitHub Secret）。
# 查看密码：kubectl get secret grafana-admin-credentials -n monitoring -o jsonpath='{.data.admin-password}' | base64 -d
#
# 与 Loki 同命名空间时用短 DNS 即可。

adminUser: admin
admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki-gateway
        access: proxy
        isDefault: true

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
