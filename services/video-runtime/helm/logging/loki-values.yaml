# Grafana Loki（SingleBinary）— 与官方 monolithic 安装一致：
# https://grafana.com/docs/loki/latest/setup/install/helm/install-monolithic/
#
# 默认带集群内 MinIO，便于一条命令跑通；生产建议改 S3 + IRSA，见：
# https://grafana.com/docs/loki/latest/setup/install/helm/deployment-guides/aws/
#
# 同一集群 dev/prod 不必各装一套 Loki：查询时用 LogQL 过滤 namespace，例如 {namespace="prod"}。

loki:
  # 单集群内网日志栈：关闭多租户鉴权，否则 Gateway 要求 X-Scope-OrgID，Promtail 默认不带会 401、Grafana Explore 也无数据。
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 336h
  ruler:
    enable_api: true

# 集群若无 default StorageClass，须显式指定（EKS 常见为 gp2 / gp3）。
# 动态 EBS 须先装 EBS CSI：scripts/ensure-ebs-csi-addon.sh；说明见 docs/aws-and-kubernetes.md「第 16 步」。
minio:
  enabled: true
  persistence:
    size: 10Gi
    storageClass: gp2

deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 30Gi
    storageClass: gp2
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0

# Memcached cache pods：chart 默认 allocatedMemory 极高（chunks 8192 MiB / results 1024 MiB），
# 导致 pod memory requests 远超实际使用量，Cluster Autoscaler 无法缩容 node。
# 实测 chunks-cache 仅用 ~300 MiB，results-cache ~30 MiB，按 5× headroom 设置。
chunksCache:
  allocatedMemory: 1536
  allocatedCPU: 100
resultsCache:
  allocatedMemory: 256
  allocatedCPU: 100
