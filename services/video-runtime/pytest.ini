[pytest]
# Pytest configuration

# 设置基础目录
pythonpath = .

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests that make real API calls (deselect with '-m "not integration"')
    unit: Unit tests with mocked dependencies
    slow: Tests that take a long time to run
    requires_google: needs GOOGLE_API_KEY (e.g. Gemini)
    requires_openai: needs OPENAI_API_KEY (e.g. GPT)
    prompt_matrix_log: full PROMPTS_CONFIG matrix log test (many API calls, use with -s)

# Async configuration - 设置为 auto 避免警告
asyncio_mode = auto

# Output options
addopts = 
    --tb=short
    --strict-markers
    --strict-config
    -v
    --disable-warnings

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::pytest.PytestUnknownMarkWarning

# Python files to ignore
norecursedirs = .git .tox dist *.egg __pycache__

