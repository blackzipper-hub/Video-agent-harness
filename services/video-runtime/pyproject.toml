[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cuti-agent"
version = "0.1.0"
description = "Cuti video agent: chat-driven music-video / storyboard generation service"
requires-python = ">=3.11,<4.0.0"
dependencies = [
    # === Web Framework ===
    "fastapi>=0.104.0",
    "uvicorn>=0.23.2",
    "pydantic>=2.4.2",
    "pydantic-settings>=2.0.3",
    "python-multipart>=0.0.6",
    "httpx>=0.24.1",
    "python-dotenv>=1.0.0",
    
    # === LangChain / LangGraph / LangSmith ===
    # NOTE: 引入 deepagents(create_deep_agent + Skills) 需要 langchain>=1.3.11 / langgraph>=1.2.5，
    #       并连带 langsmith>=0.8.11、langgraph-checkpoint>=4.1（故 checkpoint-postgres 升到 >=3.1.0）。
    "langchain (>=1.3.11,<2.0.0)",
    "langchain-core (>=1.4.0,<2.0.0)",
    "langchain-openai>=0.1.0",
    "langchain-community>=0.2.0",
    "langchain-google-genai (>=4.2.5,<5.0.0)",
    "langchain-anthropic (>=1.4.0,<2.0.0)",
    "langgraph (>=1.2.5,<1.3.0)",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langsmith (>=0.8.11,<0.11.0)",
    "deepagents (>=0.6.12,<0.7.0)",
    
    # === AI / ML ===
    "openai>=1.1.0",
    "google-genai[aiohttp] (>=1.56.0,<2.0.0)",
    "replicate (>=1.0.7,<2.0.0)",
    
    # === Database ===
    "sqlmodel>=0.0.8",
    "aiosqlite>=0.19.0",
    "alembic>=1.12.0",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "asyncpg>=0.29.0",
    "msgspec>=0.18.0",
    "jsonschema>=4.23.0",
    "pyyaml>=6.0",
    
    # === Redis ===
    "redis>=5.0.0",
    
    # === Authentication & Security ===
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "PyJWT>=2.8.0",
    "bcrypt (==3.2.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    
    # === Payment ===
    "stripe>=8.0.0",
    
    # === Media Processing ===
    "Pillow>=10.3.0",
    "pydub (>=0.25.1,<0.26.0)",
    "pysubs2 (>=1.8.0,<2.0.0)",
    
    # === Document Processing ===
    "beautifulsoup4 (>=4.13.4,<5.0.0)",
    "lxml (>=5.4.0,<6.0.0)",
    "weasyprint>=60.0",
    "pydyf>=0.10.0,<0.11.0",
    
    # === HTTP & Network ===
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "aiofiles (>=24.1.0,<25.0.0)",
    
    # === Utilities ===
    "filelock>=3.13.0",
    "tenacity (>=9.1.2,<10.0.0)",
    "apscheduler (>=3.10.4,<4.0.0)",
    "boto3 (>=1.40.57,<2.0.0)",
    "uvloop (>=0.22.1,<0.23.0)",
    "httptools (>=0.7.1,<0.8.0)",
    "psutil>=5.9.0",
    
    # === MCP (server: fastmcp; client: langchain adapters used by the video-edit route) ===
    "fastmcp>=3.0.0",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
]

[project.optional-dependencies]
dev = [
    # === Testing ===
    "pytest>=7.4.2",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0",
    
    # === Code Formatting ===
    "black>=23.9.1",
    "isort>=5.12.0",
    
    # === Profiling ===
    "py-spy>=0.3.14",  # Sampling profiler for Python
    
    # === LangGraph Development ===
    "langgraph-cli[inmem]>=0.4.0",  # Required for 'langgraph dev' and LangGraph Studio
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

# The service is a flat-layout monorepo package. Without this, setuptools' auto
# discovery aborts on the multiple top-level dirs (init/, helm/, tests/, ...).
# List only the real importable runtime packages so `pip install -e .` works.
# app/ contains the video agent plus app/chat (chat router) and app/chat/prompts.
[tool.setuptools.packages.find]
include = ["app*", "prompts*", "ee*"]
[dependency-groups]
dev = [
    "py-spy (>=0.4.1,<0.5.0)"
]
