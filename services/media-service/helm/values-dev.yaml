replicaCount: 1

image:
  repository: 699475938168.dkr.ecr.ap-southeast-2.amazonaws.com/cuti-media-service
  tag: latest

resources:
  requests:
    cpu: "2000m"
    memory: "2Gi"
  limits:
    cpu: "2000m"
    memory: "4Gi"

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 12
  targetCPUUtilizationPercentage: 70
  scaleUp:
    stabilizationWindowSeconds: 30
    maxPods: 4
    periodSeconds: 60
  scaleDown:
    stabilizationWindowSeconds: 300
    maxPods: 1
    periodSeconds: 120

workspace:
  sizeLimit: 20Gi

env:
  ENVIRONMENT: development
  LOG_LEVEL: debug
  PORT: "8080"
  FFMPEG_THREADS: "2"
  MAX_CONCURRENT_JOBS: "4"
  WORKSPACE_BASE: /workspace
  WORKSPACE_TTL_HOURS: "2"
  WORKSPACE_AUTO_CLEANUP: "true"
  AWS_REGION: ap-southeast-2
  WATERMARK_IMAGE_PATH: assets/watermark.png

nodeSelector:
  workload: media-processing

serviceAccountName: cuti-media-service-sa

secretEnvFrom: cuti-media-service-secrets

ingress:
  enabled: true
  scheme: internal
  annotations:
    alb.ingress.kubernetes.io/tags: Environment=dev,Project=cuti-media-service
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=1200

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
